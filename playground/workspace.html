<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        <title>Velo Terminal — LuxAlgo Vela</title>
        <meta name="description" content="LuxAlgo Vela Multi-Pane Financial Charting Workstation" />
        <meta name="theme-color" content="#202126" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Vela" />
        <meta name="mobile-web-app-capable" content="yes" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #202126;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                -webkit-touch-callout: none;
                user-select: none;
            }
            #workspace {
                flex: 1;
                position: relative;
                width: 100%;
                min-height: 0;
            }
            /* Hide redundant trade panel toggle icon in panels group */
            button.vela-widget-panel-trade\.panel,
            [class*="vela-widget-panel-trade.panel"] {
                display: none !important;
            }
        </style>
    </head>
    <body>
        <div id="workspace"></div>
        <script type="module" src="./workspace.ts"></script>
    </body>
</html>
