<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LuxAlgo Vela Workstation — Liquidity & Technical Analysis</title>
    <meta name="description" content="LuxAlgo Vela Workstation with 100% Genuine LiquidityMapper & Order Flow Engines" />
    <meta name="theme-color" content="#121215" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/quant-watchlist.css" />
    <link rel="stylesheet" href="/quant-workspace-picker.css" />
    <link rel="stylesheet" href="/quant-indicator-templates.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121215;
            color: #d9e2df;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-variant-numeric: tabular-nums;
            user-select: none;
            -webkit-touch-callout: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        #workspace {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        /* Topbar styling */
        .vela-widget-topbar {
            background: var(--vela-bg-main, #121215) !important;
            border-bottom: 1px solid var(--vela-border, #252b2c) !important;
        }

        /* Synchronize Vela cell & toolbar backgrounds with theme tokens */
        .vela-ws-grid {
            background: var(--vela-bg-main, #121215) !important;
        }
        .vela-cell {
            background: var(--vela-bg-main, #121215) !important;
            border-color: var(--vela-border, #252b2c) !important;
        }
        .vela-ws-grid[data-multi="1"] .vela-cell[data-active="1"]::after {
            border: 1px solid var(--vela-ui, #5b9bff) !important;
        }
        .vela-drawing-toolbar {
            border-right: 1px solid var(--vela-border, #252b2c) !important;
            background: var(--vela-bg-panel, #111315) !important;
        }
        .vela-widget-bottombar {
            border-top: 1px solid var(--vela-border, #252b2c) !important;
            background: var(--vela-bg-panel, #111315) !important;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="./workspace.ts"></script>
</body>
</html>
